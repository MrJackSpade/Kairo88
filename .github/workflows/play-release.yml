name: Google Play release

# tag-builds.yml dispatches this after it publishes a release tag (not prereleases), and it can be
# run by hand to publish an existing release's Play bundle.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose Play bundle to publish'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: MrJackSpade/Kairo/.github/workflows/app-play-release.yml@41d97a27a5359df7c0824d3ad159b1da993fc056
    with:
      name: Kairo88
      package: com.loxifi.kairo88
      tag: ${{ inputs.tag }}
